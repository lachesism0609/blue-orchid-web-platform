name: Test and deploy

on:
  pull_request:
  push:
    branches: [codex/complete-blue-orchid-store]
  workflow_dispatch:

concurrency:
  group: blue-orchid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run db:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/complete-blue-orchid-store'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Require production PostgreSQL
        if: env.DATABASE_URL == ''
        run: |
          echo "Add the DATABASE_URL repository or production-environment secret before deploying."
          exit 1
      - name: Migrate and seed PostgreSQL catalogue
        if: env.DATABASE_URL != ''
        run: npm run db:migrate && npm run db:seed
      - name: Deploy Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.DATABASE_URL != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name blue-orchid-web-platform --branch codex/complete-blue-orchid-store --commit-hash ${{ github.sha }}
      - name: Cloudflare credentials not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Verification passed; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable workflow deployment."
